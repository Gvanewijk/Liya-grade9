<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#5b3fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Liya's Math Lab - Grade 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#5b3fd1; --bg2:#1fb5a6; --card:#ffffff; --ink:#22213a; --soft:#6d6a8a;
  --accent:#ff7a59; --good:#17a673; --bad:#e2445c; --gold:#ffb703; --line:#ece9f7;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Heebo',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(140deg,var(--bg1),var(--bg2));min-height:100vh;}
#app{max-width:720px;overflow-x:hidden;margin:0 auto;padding:14px 14px 40px;}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;margin-bottom:12px}
header h1{font-size:1.35rem;margin:0;font-weight:800;line-height:1.2}
header .sub{font-size:.85rem;opacity:.9}
.pill{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,10,80,.18);margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.15rem}
.focus li{margin:5px 0}
.focus .strong{color:var(--good);font-weight:700}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.topic{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#faf9ff;text-align:start;font:inherit;color:inherit}
.topic.sel{border-color:var(--bg1);background:#efeaff}
.topic .ic{font-size:1.7rem}
.topic b{display:block;margin:4px 0 2px}
.topic small{color:var(--soft)}
.levels{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.lvl{flex:1;min-width:110px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px;font:inherit;cursor:pointer}
.lvl.sel{border-color:var(--accent);background:#fff2ee;font-weight:700}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;color:#fff;background:var(--bg1)}
.btn.alt{background:var(--accent)}
.btn.ghost{background:#efeaff;color:var(--bg1)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wide{width:100%}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:#f4f2fd;border-radius:12px;padding:8px 12px;font-weight:700}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tro{border-radius:12px;padding:8px;text-align:center;background:#f4f2fd;opacity:.45}
.tro.on{opacity:1;background:#fff6d6;box-shadow:inset 0 0 0 2px var(--gold)}
.tro .ic{font-size:1.6rem}
.tro small{display:block;color:var(--soft);font-size:.75rem}
.topbar{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;margin-bottom:8px;gap:8px}
.prog{height:10px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden;margin-bottom:12px}
.prog div{height:100%;background:var(--gold);transition:width .3s}
.qtext{font-size:1.12rem;line-height:1.65}
.m{font-family:'Heebo',sans-serif;font-weight:700;white-space:nowrap;unicode-bidi:isolate;color:#3a2a9e}
canvas{display:block;margin:12px auto;background:#fff;border-radius:12px;border:1px solid var(--line)}
.ans{display:flex;gap:10px;margin-top:12px}
.ans input{flex:1;min-width:0;width:100%;font:inherit;font-size:1.25rem;padding:10px 12px;border:2px solid var(--line);border-radius:12px;direction:ltr;text-align:center}
.ans input:focus{outline:none;border-color:var(--bg1)}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{font:inherit;font-size:1.05rem;padding:11px;border-radius:12px;border:2px solid var(--line);background:#faf9ff;cursor:pointer;text-align:start}
.choice.right{border-color:var(--good);background:#e6f8ef}
.choice.wrong{border-color:var(--bad);background:#fdecef}
.fb{margin-top:12px;border-radius:12px;padding:12px;display:none;line-height:1.6}
.fb.good{display:block;background:#e6f8ef;border:2px solid var(--good)}
.fb.bad{display:block;background:#fdecef;border:2px solid var(--bad)}
.fb.try{display:block;background:#fff6e5;border:2px solid var(--gold)}
.hintbox{display:none;margin-top:10px;background:#eef6ff;border-radius:12px;padding:10px;border:2px dashed #7aa7e8}
.st{padding:3px 0}
.actions{display:flex;gap:10px;margin-top:12px;justify-content:space-between;flex-wrap:wrap}
.review{border-top:1px solid var(--line);padding:10px 0}
.big{font-size:3rem;font-weight:800;text-align:center;margin:6px 0}
.center{text-align:center}
.hidden{display:none!important}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;background:transparent;border:0;margin:0;border-radius:0}
footer{text-align:center;color:rgba(255,255,255,.8);font-size:.8rem;margin-top:10px}
@media (max-width:480px){ .topics{grid-template-columns:1fr} header h1{font-size:1.15rem} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div>
    <button class="pill" id="langBtn" onclick="toggleLang()"></button>
  </header>

  <!-- HOME -->
  <section id="home">
    <div class="card focus">
      <h2 id="focusTitle"></h2>
      <ul id="focusList"></ul>
    </div>
    <div class="card">
      <h2 id="pickTopic"></h2>
      <div class="topics" id="topics"></div>
      <h2 id="pickLevel" style="margin-top:14px"></h2>
      <div class="levels" id="levels"></div>
      <button class="btn wide" id="startBtn" onclick="startPractice()"></button>
    </div>
    <div class="card">
      <h2 id="examTitle"></h2>
      <p id="examDesc" style="margin-top:0"></p>
      <button class="btn alt wide" id="examBtn" onclick="startExam()"></button>
    </div>
    <div class="card">
      <h2 id="statsTitle"></h2>
      <div class="stats" id="stats"></div>
      <h2 id="trophyTitle" style="margin-top:14px"></h2>
      <div class="trophies" id="trophies"></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="topbar"><span id="qTopic"></span><span id="qCount"></span><span id="qStreak"></span></div>
    <div class="prog"><div id="progBar"></div></div>
    <div class="card">
      <div class="qtext" id="qText"></div>
      <canvas id="cv" class="hidden"></canvas>
      <div class="ans" id="numArea">
        <input id="ansInput" inputmode="decimal" autocomplete="off">
        <button class="btn" id="checkBtn" onclick="checkNum()"></button>
      </div>
      <div class="choices hidden" id="choiceArea"></div>
      <div class="hintbox" id="hintBox"></div>
      <div class="fb" id="fb"></div>
      <div class="actions">
        <button class="btn ghost" id="homeBtn" onclick="goHome()"></button>
        <button class="btn ghost" id="hintBtn" onclick="showHint()"></button>
        <button class="btn alt hidden" id="nextBtn" onclick="nextQ()"></button>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card center">
      <h2 id="resTitle"></h2>
      <div class="big" id="resScore"></div>
      <div id="resMsg"></div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn" id="againBtn" onclick="again()"></button>
        <button class="btn ghost" id="home2Btn" onclick="goHome()"></button>
      </div>
    </div>
    <div class="card" id="reviewCard">
      <h2 id="reviewTitle"></h2>
      <div id="reviewList"></div>
    </div>
  </section>
  <footer id="foot"></footer>
</div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* ============ BASICS ============ */
var LANG = 'he';
var STORE_KEY = 'liya9_v1';
var SQ = '²', ROOT = '\u221A', DEG = '°', NIS = '\u20AA', ANG = '\u2220', MINUS = '\u2212', APPROX = '\u2248', TIMES = '·';

function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function r1(x) { return Math.round(x * 10) / 10; }
function fmt(x) { return String(Math.round(x * 100) / 100).replace('-', MINUS); }
function m(s) { return '<span class="m" dir="ltr">' + s + '</span>'; }
function B(en, he) { return { en: en, he: he }; }
function L(o) { return (o && typeof o === 'object') ? o[LANG] : o; }
function lines(arr) { return arr.map(function (l) { return '<div class="st">' + l + '</div>'; }).join(''); }
function both(arrEn, arrHe) { return B(lines(arrEn), lines(arrHe || arrEn)); }
function sgn(o) { return o > 0 ? ' + ' + o : (o < 0 ? ' ' + MINUS + ' ' + (-o) : ''); }
function expr(c, o) { return (c === 1 ? '' : c) + 'x' + sgn(o); }
var KM = B('km', 'ק"מ');
var ROUND = B(' (round to 1 decimal place)', ' (עגלי לספרה אחת אחרי הנקודה)');

var TRIPLES = [[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20],[15,20,25],[7,24,25],[10,24,26],[20,21,29],[18,24,30],[16,30,34],[21,28,35],[12,35,37],[15,36,39],[24,32,40],[9,40,41]];
function tripleUpTo(maxC) {
  var t = pick(TRIPLES.filter(function (x) { return x[2] <= maxC; }));
  return Math.random() < 0.5 ? [t[0], t[1], t[2]] : [t[1], t[0], t[2]];
}
function Q(o) { o.kind = o.kind || 'num'; o.traps = (o.traps || []).filter(function (t) { return Math.abs(t.v - o.answer) > 0.15; }); return o; }

/* ============ TOPIC 1: PYTHAGORAS ============ */
function gHyp(lv) {
  var a, b, c, round = 0;
  if (lv >= 3 && Math.random() < 0.45) { do { a = rnd(2, 14); b = rnd(2, 14); c = Math.sqrt(a * a + b * b); } while (Number.isInteger(c)); round = 1; }
  else { var t = tripleUpTo(lv <= 1 ? 15 : (lv === 2 ? 30 : 41)); a = t[0]; b = t[1]; c = t[2]; }
  var s = a * a + b * b, ans = round ? r1(c) : c;
  var calc = [m('c' + SQ + ' = a' + SQ + ' + b' + SQ), m('c' + SQ + ' = ' + a + SQ + ' + ' + b + SQ + ' = ' + a * a + ' + ' + b * b + ' = ' + s), m('c = ' + ROOT + s + (round ? ' ' + APPROX + ' ' : ' = ') + fmt(ans))];
  return Q({ topic: 'pyth', answer: ans, round: round,
    text: B('In a right triangle the legs are ' + m(a) + ' and ' + m(b) + '. Find the hypotenuse.' + (round ? ROUND.en : ''),
            'במשולש ישר זווית אורכי הניצבים הם ' + m(a) + ' ו-' + m(b) + '. חשבי את אורך היתר.' + (round ? ROUND.he : '')),
    hint: B('The hypotenuse is the longest side, opposite the right angle: ' + m('c' + SQ + ' = a' + SQ + ' + b' + SQ),
            'היתר הוא הצלע הארוכה, מול הזווית הישרה: ' + m('c' + SQ + ' = a' + SQ + ' + b' + SQ)),
    steps: both(calc),
    traps: [{ v: a + b, msg: B('You added the sides. Pythagoras adds the SQUARES and then takes a square root.', 'חיברת את הצלעות. בפיתגורס מחברים את הריבועים ואז מוציאים שורש.') },
            { v: s, msg: B('Almost! ' + m(s) + ' is c' + SQ + ' \u2013 take the square root.', 'כמעט! ' + m(s) + ' זה c' + SQ + ' \u2013 צריך להוציא שורש.') }],
    draw: drawRightTri({ a: a, b: b, c: '?' }) });
}

function gLeg(lv) {
  var a, b, c, round = 0;
  if (lv >= 3 && Math.random() < 0.45) { do { c = rnd(8, 20); a = rnd(3, c - 2); b = Math.sqrt(c * c - a * a); } while (Number.isInteger(b)); round = 1; }
  else { var t = tripleUpTo(lv <= 1 ? 17 : 41); a = t[0]; b = t[1]; c = t[2]; }
  var d = c * c - a * a, ans = round ? r1(b) : b;
  var calc = [m('a' + SQ + ' + b' + SQ + ' = c' + SQ), m('b' + SQ + ' = c' + SQ + ' ' + MINUS + ' a' + SQ), m('b' + SQ + ' = ' + c + SQ + ' ' + MINUS + ' ' + a + SQ + ' = ' + c * c + ' ' + MINUS + ' ' + a * a + ' = ' + d), m('b = ' + ROOT + d + (round ? ' ' + APPROX + ' ' : ' = ') + fmt(ans))];
  return Q({ topic: 'pyth', answer: ans, round: round, isLeg: true,
    text: B('In a right triangle the hypotenuse is ' + m(c) + ' and one leg is ' + m(a) + '. Find the other leg.' + (round ? ROUND.en : ''),
            'במשולש ישר זווית אורך היתר הוא ' + m(c) + ' ואורך אחד הניצבים הוא ' + m(a) + '. חשבי את אורך הניצב השני.' + (round ? ROUND.he : '')),
    hint: B('The hypotenuse is already given, so SUBTRACT the squares: ' + m('b' + SQ + ' = c' + SQ + ' ' + MINUS + ' a' + SQ),
            'היתר כבר נתון \u2013 לכן מחסרים ריבועים: ' + m('b' + SQ + ' = c' + SQ + ' ' + MINUS + ' a' + SQ)),
    steps: both(calc),
    traps: [{ v: r1(Math.sqrt(c * c + a * a)), msg: B('You added the squares \u2013 but the hypotenuse is already given! Looking for a leg? SUBTRACT: ' + m('b' + SQ + ' = c' + SQ + ' ' + MINUS + ' a' + SQ), 'חיברת ריבועים \u2013 אבל היתר כבר נתון! מחפשים ניצב? מחסרים: ' + m('b' + SQ + ' = c' + SQ + ' ' + MINUS + ' a' + SQ)) },
            { v: c - a, msg: B('Subtracting the sides doesn\u2019t work. Subtract the squares, then take a root.', 'חיסור של הצלעות לא עובד. מחסרים את הריבועים ואז מוציאים שורש.') },
            { v: d, msg: B('Almost! ' + m(d) + ' is b' + SQ + ' \u2013 take the square root.', 'כמעט! ' + m(d) + ' זה b' + SQ + ' \u2013 צריך להוציא שורש.') }],
    draw: drawRightTri({ a: a, b: '?', c: c }) });
}

function gIsRight(lv) {
  var t = tripleUpTo(30), s;
  if (Math.random() < 0.5) s = t.slice();
  else s = Math.random() < 0.5 ? [t[0], t[1], t[2] + pick([-1, 1])] : [t[0] + 1, t[1], t[2]];
  s.sort(function (x, y) { return x - y; });
  var p = s[0], q = s[1], Lg = s[2], right = (p * p + q * q === Lg * Lg);
  var shown = shuffle(s);
  var cmp = m(Lg + SQ + ' = ' + Lg * Lg) + ' , ' + m(p + SQ + ' + ' + q + SQ + ' = ' + p * p + ' + ' + q * q + ' = ' + (p * p + q * q));
  return Q({ topic: 'pyth', kind: 'choice', answer: right ? 'yes' : 'no',
    choices: [{ key: 'yes', label: B('Yes \u2013 it is a right triangle', 'כן \u2013 זה משולש ישר זווית') }, { key: 'no', label: B('No \u2013 it is not a right triangle', 'לא \u2013 זה לא משולש ישר זווית') }],
    text: B('A triangle has sides ' + m(shown.join(', ')) + '. Is it a right triangle?', 'אורכי הצלעות של משולש הם ' + m(shown.join(', ')) + '. האם המשולש ישר זווית?'),
    hint: B('Check: is (longest side)' + SQ + ' equal to the sum of the squares of the other two sides?', 'בדקי: האם (הצלע הארוכה)' + SQ + ' שווה לסכום הריבועים של שתי הצלעות האחרות?'),
    steps: both([cmp, right ? 'Equal \u2013 so it IS a right triangle (converse of Pythagoras).' : 'Not equal \u2013 so it is NOT a right triangle.'],
                [cmp, right ? 'שווה \u2013 לכן המשולש ישר זווית (המשפט ההפוך לפיתגורס).' : 'לא שווה \u2013 לכן המשולש אינו ישר זווית.']) });
}

function gWord(lv) {
  var types = ['ladder', 'screen'];
  if (lv >= 2) types.push('kite');
  if (lv >= 3) types.push('park');
  var ty = pick(types), t, a, b, c;
  if (ty === 'ladder') {
    t = pick([[3,4,5],[6,8,10],[5,12,13],[1.5,2,2.5]]); a = t[0]; b = t[1]; c = t[2];
    return Q({ topic: 'pyth', answer: b, isLeg: true,
      text: B('A ladder ' + m(c + ' m') + ' long leans against a wall. Its foot is ' + m(a + ' m') + ' from the wall. How high up the wall does it reach (in m)?',
              'סולם באורך ' + m(c + ' מ׳') + ' נשען על קיר. רגל הסולם רחוקה ' + m(a + ' מ׳') + ' מהקיר. לאיזה גובה על הקיר מגיע הסולם (במטרים)?'),
      hint: B('The ladder is the hypotenuse. The height is a leg \u2013 subtract squares.', 'הסולם הוא היתר. הגובה הוא ניצב \u2013 מחסרים ריבועים.'),
      steps: both([m('h' + SQ + ' = ' + c + SQ + ' ' + MINUS + ' ' + a + SQ + ' = ' + fmt(c * c) + ' ' + MINUS + ' ' + fmt(a * a) + ' = ' + fmt(b * b)), m('h = ' + fmt(b) + ' m')]),
      traps: [{ v: r1(Math.sqrt(c * c + a * a)), msg: B('The ladder is the longest side (hypotenuse) \u2013 subtract the squares.', 'הסולם הוא הצלע הארוכה (היתר) \u2013 מחסרים ריבועים.') }],
      draw: drawRightTri({ a: a, b: '?', c: c }) });
  }
  if (ty === 'screen') {
    t = pick([[60,80,100],[45,60,75],[30,40,50],[36,48,60],[24,32,40]]); a = t[0]; b = t[1]; c = t[2];
    return Q({ topic: 'pyth', answer: c,
      text: B('A screen is ' + m(b + ' cm') + ' wide and ' + m(a + ' cm') + ' tall. How long is its diagonal (in cm)?',
              'מסך ברוחב ' + m(b + ' ס״מ') + ' ובגובה ' + m(a + ' ס״מ') + '. מה אורך האלכסון שלו (בס״מ)?'),
      hint: B('The diagonal splits the rectangle into two right triangles. The diagonal is the hypotenuse.', 'האלכסון מחלק את המלבן לשני משולשים ישרי זווית. האלכסון הוא היתר.'),
      steps: both([m('d' + SQ + ' = ' + b + SQ + ' + ' + a + SQ + ' = ' + b * b + ' + ' + a * a + ' = ' + c * c), m('d = ' + c)]),
      traps: [{ v: a + b, msg: B('Add the squares, not the sides.', 'מחברים ריבועים, לא צלעות.') }],
      draw: drawRightTri({ a: b, b: a, c: '?' }) });
  }
  if (ty === 'kite') {
    t = pick([[30,40,50],[18,24,30],[20,21,29],[9,40,41],[24,32,40]]); a = t[0]; b = t[1]; c = t[2];
    return Q({ topic: 'pyth', answer: b, isLeg: true,
      text: B('A kite string is ' + m(c + ' m') + ' long and pulled tight. Noa stands ' + m(a + ' m') + ' from the spot right under the kite. How high is the kite (in m)?',
              'חוט של עפיפון באורך ' + m(c + ' מ׳') + ' מתוח. נועה עומדת במרחק ' + m(a + ' מ׳') + ' מהנקודה שנמצאת בדיוק מתחת לעפיפון. באיזה גובה נמצא העפיפון (במטרים)?'),
      hint: B('The string is the hypotenuse. The height is a leg.', 'החוט הוא היתר. הגובה הוא ניצב.'),
      steps: both([m('h' + SQ + ' = ' + c + SQ + ' ' + MINUS + ' ' + a + SQ + ' = ' + c * c + ' ' + MINUS + ' ' + a * a + ' = ' + b * b), m('h = ' + b)]),
      traps: [{ v: r1(Math.sqrt(c * c + a * a)), msg: B('The string is the hypotenuse \u2013 subtract the squares.', 'החוט הוא היתר \u2013 מחסרים ריבועים.') }, { v: c - a, msg: B('Subtract the squares, not the sides.', 'מחסרים ריבועים, לא צלעות.') }],
      draw: drawRightTri({ a: a, b: '?', c: c }) });
  }
  t = pick([[60,80,100],[50,120,130],[90,120,150],[80,150,170]]); a = t[0]; b = t[1]; c = t[2];
  return Q({ topic: 'pyth', answer: a + b - c,
    text: B('A rectangular park is ' + m(a + ' m') + ' by ' + m(b + ' m') + '. Instead of walking along two edges, Liya cuts straight across the diagonal. How many metres does she save?',

  again: B('Again \u21BB', 'עוד פעם \u21BB'),
  reviewTitle: B('Let\u2019s review these', 'בואי נעבור על אלה'),
  noMistakes: B('No mistakes \u2013 perfect! \u{1F31F}', 'אין טעויות \u2013 מושלם! \u{1F31F}'),
  correctTotal: B('correct answers', 'תשובות נכונות'), bestStreak: B('best streak', 'רצף שיא'), examBest: B('best test', 'מבחן הכי טוב'),
  newTrophy: B('New trophy!', 'גביע חדש!'),
  foot: B('Made with \u2665 for Liya', 'נבנה באהבה בשביל לייה'),
  enterNum: B('Type a number', 'הקלידי מספר')
};
var TOPICS = {
  pyth: { ic: '\u{1F4D0}', name: B('Pythagoras', 'משפט פיתגורס'), d: B('Legs, hypotenuse, test-style triangles, word problems', 'ניצבים, יתר, משולשים כמו במבחן, בעיות מילוליות') },
  graph: { ic: '\u{1F4C8}', name: B('Reading graphs', 'קריאת גרפים'), d: B('Flat parts, rates, true/false/can\u2019t know, formulas', 'קטעים אופקיים, קצב, נכון/לא נכון/אי אפשר לדעת, נוסחאות') },
  angles: { ic: '\u{1F53A}', name: B('Angles in a triangle', 'זוויות במשולש'), d: B('Equations with x, exterior angles, bisectors, isosceles', 'משוואות עם x, זווית חיצונית, חוצה זווית, שווה שוקיים') },
  coord: { ic: '\u{1F680}', name: B('Next step: distance on the grid', 'השלב הבא: מרחק במערכת צירים'), d: B('Pythagoras on the coordinate plane', 'פיתגורס במערכת צירים') }
};
var LEVELS = [B('1 · Warm-up', '1 · חימום'), B('2 · Practice', '2 · תרגול'), B('3 · Test level', '3 · רמת מבחן'), B('4 · Challenge', '4 · אתגר')];
var TROPHIES = [
  { id: 'first', ic: '\u2B50', n: B('First step', 'צעד ראשון'), d: B('First correct answer', 'תשובה נכונה ראשונה'), t: function (s) { return s.correct >= 1; } },
  { id: 's5', ic: '\u{1F525}', n: B('On fire', 'בוערת'), d: B('5 in a row', '5 ברצף'), t: function (s) { return s.best >= 5; } },
  { id: 's10', ic: '\u26A1', n: B('Unstoppable', 'בלתי ניתנת לעצירה'), d: B('10 in a row', '10 ברצף'), t: function (s) { return s.best >= 10; } },
  { id: 'leg', ic: '\u{1F50D}', n: B('Leg hunter', 'ציידת הניצבים'), d: B('Find 10 legs with Pythagoras', 'למצוא 10 ניצבים בפיתגורס'), t: function (s) { return s.leg >= 10; } },
  { id: 'pyth', ic: '\u{1F4D0}', n: B('Pythagoras pro', 'אלופת פיתגורס'), d: B('15 correct at level 3+', '15 נכונות ברמה 3 ומעלה'), t: function (s) { return s.hi.pyth >= 15; } },
  { id: 'graph', ic: '\u{1F4C8}', n: B('Graph reader', 'קוראת גרפים'), d: B('15 correct at level 3+', '15 נכונות ברמה 3 ומעלה'), t: function (s) { return s.hi.graph >= 15; } },
  { id: 'angles', ic: '\u{1F53A}', n: B('Angle ace', 'מלכת הזוויות'), d: B('15 correct at level 3+', '15 נכונות ברמה 3 ומעלה'), t: function (s) { return s.hi.angles >= 15; } },
  { id: 'coord', ic: '\u{1F680}', n: B('Explorer', 'חוקרת'), d: B('10 correct on the grid', '10 נכונות במערכת צירים'), t: function (s) { return s.tc.coord >= 10; } },
  { id: 'exam90', ic: '\u{1F3C6}', n: B('Test ready', 'מוכנה למבחן'), d: B('90+ in a test simulation', '90+ בסימולציית מבחן'), t: function (s) { return s.examBest >= 90; } },
  { id: 'c100', ic: '\u{1F48E}', n: B('Hundred club', 'מועדון המאה'), d: B('100 correct answers', '100 תשובות נכונות'), t: function (s) { return s.correct >= 100; } }
];

/* ============ STATE & STORAGE ============ */
var store = { correct: 0, best: 0, leg: 0, examBest: 0, hi: { pyth: 0, graph: 0, angles: 0, coord: 0 }, tc: { pyth: 0, graph: 0, angles: 0, coord: 0 }, trophies: {}, lang: 'he' };
function load() { try { var s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s) { for (var k in s) store[k] = s[k]; } } catch (e) {} }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
var S = null, selTopic = 'pyth', selLevel = 2, streak = 0;

/* ============ RENDERING ============ */
function $(id) { return document.getElementById(id); }
function show(id) { ['home', 'quiz', 'results'].forEach(function (s) { $(s).classList.toggle('hidden', s !== id); }); window.scrollTo(0, 0); }
function renderStatic() {
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'he' ? 'rtl' : 'ltr';
  ['title', 'subtitle', 'focusTitle', 'pickTopic', 'pickLevel', 'examTitle', 'examDesc', 'statsTitle', 'trophyTitle', 'reviewTitle'].forEach(function (k) { $(k).innerHTML = L(UI[k]); });
  $('langBtn').textContent = L(UI.lang); $('startBtn').textContent = L(UI.start); $('examBtn').textContent = L(UI.examBtn);
  $('checkBtn').textContent = L(UI.check); $('hintBtn').textContent = L(UI.hint); $('homeBtn').textContent = L(UI.home);
  $('home2Btn').textContent = L(UI.home); $('againBtn').textContent = L(UI.again); $('foot').innerHTML = L(UI.foot);
  $('ansInput').placeholder = L(UI.enterNum);
  $('focusList').innerHTML = L(UI.focus).map(function (x) { return '<li>' + x + '</li>'; }).join('');
  $('topics').innerHTML = Object.keys(TOPICS).map(function (k) { var t = TOPICS[k]; return '<button class="topic' + (k === selTopic ? ' sel' : '') + '" onclick="selT(\'' + k + '\')"><span class="ic">' + t.ic + '</span><b>' + L(t.name) + '</b><small>' + L(t.d) + '</small></button>'; }).join('');
  $('levels').innerHTML = LEVELS.map(function (l, i) { return '<button class="lvl' + (i + 1 === selLevel ? ' sel' : '') + '" onclick="selL(' + (i + 1) + ')">' + L(l) + '</button>'; }).join('');
  $('stats').innerHTML = '<span class="stat">\u2705 ' + store.correct + ' ' + L(UI.correctTotal) + '</span><span class="stat">\u{1F525} ' + store.best + ' ' + L(UI.bestStreak) + '</span><span class="stat">\u{1F4DD} ' + store.examBest + ' ' + L(UI.examBest) + '</span>';
  $('trophies').innerHTML = TROPHIES.map(function (t) { return '<div class="tro' + (store.trophies[t.id] ? ' on' : '') + '"><div class="ic">' + t.ic + '</div><b>' + L(t.n) + '</b><small>' + L(t.d) + '</small></div>'; }).join('');
}
function selT(k) { selTopic = k; renderStatic(); }
function selL(n) { selLevel = n; renderStatic(); }
function toggleLang() {
  LANG = LANG === 'he' ? 'en' : 'he'; store.lang = LANG; save(); renderStatic();
  if (!$('quiz').classList.contains('hidden')) renderQuestion(true);
  if (!$('results').classList.contains('hidden')) renderResults();
}

/* ============ QUIZ FLOW ============ */
function startPractice() { S = { mode: 'practice', topic: selTopic, level: selLevel, queue: buildSession(selTopic, selLevel), idx: 0, score: 0, right: 0, wrong: [] }; streak = 0; show('quiz'); renderQuestion(); }
function startExam() { S = { mode: 'exam', topic: 'exam', level: 3, queue: buildExam(), idx: 0, score: 0, right: 0, wrong: [] }; streak = 0; show('quiz'); renderQuestion(); }
function again() { if (S.mode === 'exam') startExam(); else startPractice(); }
function goHome() { renderStatic(); show('home'); }

function renderQuestion(keep) {
  var q = S.queue[S.idx];
  if (!keep) { S.tries = 0; S.hint = false; S.done = false; S.fb = null; S.picked = {}; }
  $('qTopic').textContent = S.mode === 'exam' ? L(UI.examTitle) : TOPICS[S.topic].ic + ' ' + L(TOPICS[S.topic].name);
  $('qCount').textContent = L(UI.qOf) + ' ' + (S.idx + 1) + '/' + S.queue.length;
  $('qStreak').textContent = '\u{1F525} ' + streak;
  $('progBar').style.width = (S.idx / S.queue.length * 100) + '%';
  $('qText').innerHTML = L(q.text);
  var cv = $('cv');
  if (q.draw) { cv.classList.remove('hidden'); var c = setupCanvas(cv); q.draw(c.ctx, c.W, c.H); } else cv.classList.add('hidden');
  $('numArea').classList.toggle('hidden', q.kind !== 'num');
  $('choiceArea').classList.toggle('hidden', q.kind !== 'choice');
  if (q.kind === 'num') { if (!keep) $('ansInput').value = ''; $('ansInput').disabled = S.done; $('checkBtn').disabled = S.done; if (!S.done && !keep) setTimeout(function () { $('ansInput').focus(); }, 50); }
  else {
    $('choiceArea').innerHTML = q.choices.map(function (c) {
      var cls = S.picked[c.key] || (S.done && c.key === q.answer ? 'right' : '');
      return '<button class="choice ' + cls + '" ' + (S.done ? 'disabled' : '') + ' onclick="checkChoice(\'' + c.key + '\')">' + L(c.label) + '</button>';
    }).join('');
  }
  $('hintBtn').classList.toggle('hidden', S.mode === 'exam' || S.done);
  var hb = $('hintBox'); hb.style.display = S.hint ? 'block' : 'none'; hb.innerHTML = S.hint ? L(q.hint) : '';
  var fb = $('fb'); fb.className = 'fb' + (S.fb ? ' ' + S.fb.cls : ''); fb.innerHTML = S.fb ? L(S.fb.html) : '';
  var nb = $('nextBtn'); nb.classList.toggle('hidden', !S.done); nb.textContent = L(S.idx === S.queue.length - 1 ? UI.finish : UI.next);
}
function showHint() { S.hint = true; renderQuestion(true); }

function parseNum(s) { s = String(s).trim().replace(/\u2212/g, '-').replace(',', '.'); if (s === '' || isNaN(Number(s))) return null; return Number(s); }
function checkNum() {
  var q = S.queue[S.idx]; if (S.done) return;
  var v = parseNum($('ansInput').value); if (v === null) { $('ansInput').focus(); return; }
  var tol = q.round ? 0.11 : 0.001;
  if (Math.abs(v - q.answer) <= tol) return onRight(q);
  var trap = null; q.traps.forEach(function (t) { if (!trap && Math.abs(v - t.v) <= 0.15) trap = t; });
  onWrong(q, trap);
}
function checkChoice(key) {
  var q = S.queue[S.idx]; if (S.done) return;
  if (key === q.answer) { S.picked[key] = 'right'; return onRight(q); }
  S.picked[key] = 'wrong'; onWrong(q, null);
}
function onRight(q) {
  S.done = true; S.right++; streak++;
  var pts = S.mode === 'exam' ? 10 : (S.tries === 0 ? (S.hint ? 7 : 10) : 5); S.score += pts;
  store.correct++; store.best = Math.max(store.best, streak); store.tc[q.topic] = (store.tc[q.topic] || 0) + 1;
  if (S.level >= 3) store.hi[q.topic] = (store.hi[q.topic] || 0) + 1;
  if (q.isLeg) store.leg++;
  var pr = UI.praise;
  S.fb = { cls: 'good', html: B('<b>\u2705 ' + pick(pr.en) + ' +' + pts + '</b>' + L2('en', q.steps), '<b>\u2705 ' + pick(pr.he) + ' +' + pts + '</b>' + L2('he', q.steps)) };
  if (streak % 5 === 0) confetti();
  checkTrophies(); save(); renderQuestion(true);
}
function L2(lang, o) { return '<div style="margin-top:6px">' + o[lang] + '</div>'; }
function answerText(q, lang) { if (q.kind === 'choice') { var c = q.choices.filter(function (x) { return x.key === q.answer; })[0]; return c.label[lang]; } return m(fmt(q.answer)); }
function onWrong(q, trap) {
  S.tries++;
  if (S.mode === 'practice' && S.tries < 2) {
    S.fb = { cls: 'try', html: B('<b>\u{1F914} ' + UI.tryAgain.en + '</b>' + (trap ? '<br>' + trap.msg.en : ''), '<b>\u{1F914} ' + UI.tryAgain.he + '</b>' + (trap ? '<br>' + trap.msg.he : '')) };
    if (q.kind === 'num') $('ansInput').select();
    return renderQuestion(true);
  }
  S.done = true; streak = 0; S.wrong.push(q);
  S.fb = { cls: 'bad', html: B((trap ? trap.msg.en + '<br>' : '') + '<b>' + UI.answerIs.en + ' ' + answerText(q, 'en') + '</b>' + L2('en', q.steps), (trap ? trap.msg.he + '<br>' : '') + '<b>' + UI.answerIs.he + ' ' + answerText(q, 'he') + '</b>' + L2('he', q.steps)) };
  save(); renderQuestion(true);
}
function nextQ() {
  if (S.idx < S.queue.length - 1) { S.idx++; renderQuestion(); return; }
  if (S.mode === 'exam') { store.examBest = Math.max(store.examBest, S.score); checkTrophies(); save(); }
  if (S.score >= 80) confetti();
  show('results'); renderResults();
}
function renderResults() {
  $('resTitle').textContent = L(S.mode === 'exam' ? UI.resExam : UI.resPractice);
  $('resScore').textContent = S.mode === 'exam' ? S.score : (S.right + '/' + S.queue.length);
  var stars = S.right >= 9 ? '\u2B50\u2B50\u2B50' : (S.right >= 7 ? '\u2B50\u2B50' : (S.right >= 5 ? '\u2B50' : '\u{1F4AA}'));
  $('resMsg').innerHTML = '<div style="font-size:2rem">' + stars + '</div>' + (S.mode === 'practice' ? '<div>' + S.score + ' pts</div>' : '');
  $('reviewTitle').textContent = L(UI.reviewTitle);
  $('reviewList').innerHTML = S.wrong.length ? S.wrong.map(function (q) {
    return '<div class="review"><div class="qtext">' + L(q.text) + '</div><div><b>' + L(UI.answerIs) + ' ' + answerText(q, LANG) + '</b></div>' + L(q.steps) + '</div>';
  }).join('') : '<p>' + L(UI.noMistakes) + '</p>';
}
function checkTrophies() {
  TROPHIES.forEach(function (t) {
    if (!store.trophies[t.id] && t.t(store)) {
      store.trophies[t.id] = 1;
      var fb = $('fb'); fb.insertAdjacentHTML('beforeend', '');
      if (S && S.fb) { S.fb.html.en += '<div style="margin-top:6px">\u{1F3C6} <b>' + UI.newTrophy.en + '</b> ' + t.ic + ' ' + t.n.en + '</div>'; S.fb.html.he += '<div style="margin-top:6px">\u{1F3C6} <b>' + UI.newTrophy.he + '</b> ' + t.ic + ' ' + t.n.he + '</div>'; }
      confetti();
    }
  });
}

/* ============ CONFETTI ============ */
function confetti() {
  var cv = $('confetti'), ctx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
  var cols = ['#ffb703', '#ff7a59', '#5b3fd1', '#1fb5a6', '#e2445c'], ps = [];
  for (var i = 0; i < 120; i++) ps.push({ x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - 0.5) * 12, vy: Math.random() * -12 - 2, c: pick(cols), s: rnd(5, 9), r: Math.random() * 6 });
  var f = 0;
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.r += 0.2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); ctx.restore(); });
    if (++f < 110) requestAnimationFrame(tick); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ============ START ============ */
if (typeof document !== 'undefined') {
  load(); LANG = store.lang || 'he';
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || $('quiz').classList.contains('hidden')) return;
    if (S && S.done) nextQ(); else if (S && S.queue[S.idx].kind === 'num') checkNum();
  });
  window.addEventListener('resize', function () { if (S && !$('quiz').classList.contains('hidden')) renderQuestion(true); });
  renderStatic();
}
</script>
